<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Storage</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: #16161e;
            --accent: linear-gradient(135deg, #00b4db, #0083b0);
            --success: #10b981;
            --danger: #f43f5e;
            --text-p: #94a3b8;
            --text-h: #f8fafc;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-h);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        #loginOverlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .login-box {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            max-width: 320px;
            width: 100%;
        }

        input {
            padding: 16px;
            font-size: 18px;
            border-radius: 14px;
            border: 1px solid #2d2d39;
            background: #0f0f13;
            color: white;
            margin-bottom: 20px;
            width: 80%;
            text-align: center;
            outline: none;
        }

        #content {
            display: none;
            width: 100%;
            max-width: 550px;
            padding: 30px 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .account-card {
            background: var(--card-bg);
            border-radius: 20px;
            margin-bottom: 18px;
            padding: 22px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            border: 1px solid rgba(255,255,255,0.03);
        }

        .label { font-size: 10px; color: var(--text-p); text-transform: uppercase; font-weight: 800; margin-bottom: 8px; display: block; }
        
        .value { 
            font-family: monospace; 
            background: rgba(0,0,0,0.2); 
            padding: 12px; 
            border-radius: 10px; 
            font-size: 14px; 
            margin-bottom: 12px;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
        }

        .btn.success { background: var(--success); }

        .lock-card {
            background: rgba(244, 63, 94, 0.05);
            border: 1px dashed var(--danger);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 18px;
            color: var(--danger);
        }

        #qrcode { background: white; padding: 10px; border-radius: 12px; margin-top: 20px; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2>Вход</h2>
            <input type="password" id="passInput" placeholder="Код">
            <button class="btn" onclick="checkPass()">Открыть</button>
            <div id="qrcode"></div>
        </div>
    </div>

    <div id="content">
        <div class="header">
            <h2>Аккаунты</h2>
            <button class="btn" style="width:auto; background:#2d2d39; font-size:12px;" onclick="logout()">Выйти</button>
        </div>
        <div id="listContainer"></div>
    </div>

    <script>
        const PASS = "1488";
        const LOCK_TIME = 86400000;

        // ВНИМАНИЕ: Если ты меняешь этот список, таймеры сбросятся сами!
        const encryptedAccounts = [
            ["TWloYWlsX0FyYWJvdg==", "UTdjRTJiTjZzRg=="],
            ["U29rX1lhYklvY2huaXk=", "UjJ0WTd1QTFqVg=="],
            ["TGVvbmVsX1BlcHNp", "Rjl3RTByVDV5QQ=="],
            ["QWJzb2x1dGVfRm9yYmVz", "QTdrTTlwUjJ4Vg=="],
            ["S2FydG9zaGthX0ZyZWU=", "RDNqSDdnSzFzVQ=="],
            ["VmFJeWFfR3JhbmQ=", "UzZ2QjBuTTNrSg=="],
            ["TWFobW9vZF9BcmJpcw==", "VjNjWDlmRDJzRw=="],
            ["VHJpcHBpX1Ryb3BwaQ==", "VDV4UThlVzR6SA=="],
            ["TWFobW9vZF9NYWhtb29kb3Y=", "SDh1SjNtUTdwVw=="],
            ["TWloYWlsX0Fic29sdXRl", "V2ZZbUR0NFVJaQ=="],
            ["TWFobW9vZF9TaG92ZWw=", "SzVvWTFlUjl0RA=="],
            ["QW1ldGh5c3RfRGlhbW9uZA==", "WDJ6UjV0VzlxMw=="],
            ["TWloYWlsX1BoaWxsaXBz", "QzJtRDh5SjNlUQ=="],
            ["VHJhSWFsZWxvX1RyYWxhbGE=", "VzRuUjd0Wjl4Sw=="],
            ["TWljaGFpbF9QcmVzc3VyZQ==", "TTdhUDBzVTJjRg=="]
        ];

        function decode(str) { return decodeURIComponent(escape(atob(str))); }

        new QRCode(document.getElementById("qrcode"), {
            text: window.location.href,
            width: 120,
            height: 120
        });

        // Ключевая функция автоматического сброса
        function autoResetCheck() {
            const currentDataString = JSON.stringify(encryptedAccounts);
            const savedDataString = localStorage.getItem('last_data_content');

            if (savedDataString !== currentDataString) {
                // Если контент изменился - чистим ВСЕ блокировки
                for (let key in localStorage) {
                    if (key.startsWith('lck_')) {
                        localStorage.removeItem(key);
                    }
                }
                localStorage.setItem('last_data_content', currentDataString);
                console.log("Данные обновлены, таймеры сброшены.");
            }
        }

        function checkPass() {
            if (document.getElementById('passInput').value === PASS) {
                localStorage.setItem('session', Date.now() + 3600000);
                init();
            } else { alert('Ошибка'); }
        }

        function init() {
            autoResetCheck(); // Проверяем обновление перед запуском
            const session = localStorage.getItem('session');
            if (session && Date.now() < parseInt(session)) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                render();
            }
        }

        function render() {
            const container = document.getElementById('listContainer');
            container.innerHTML = '';
            
            encryptedAccounts.forEach((acc, i) => {
                const lock = localStorage.getItem(`lck_${i}`);
                if (lock && Date.now() < parseInt(lock)) {
                    container.innerHTML += `<div class="lock-card">АККАУНТ ИСПОЛЬЗОВАН (24Ч)</div>`;
                } else {
                    const nick = decode(acc[0]);
                    const pass = decode(acc[1]);
                    const card = document.createElement('div');
                    card.className = 'account-card';
                    card.innerHTML = `
                        <div class="data-group">
                            <span class="label">User</span>
                            <div class="value">${nick}</div>
                            <button class="btn" onclick="cp(this, ${i}, 0, '${nick}')">Ник</button>
                        </div>
                        <div class="data-group">
                            <span class="label">Pass</span>
                            <div class="value">••••••••</div>
                            <button class="btn" onclick="cp(this, ${i}, 1, '${pass}')">Пароль</button>
                        </div>
                    `;
                    container.appendChild(card);
                }
            });
        }

        let state = {};
        function cp(btn, row, type, txt) {
            navigator.clipboard.writeText(txt);
            btn.innerText = 'OK';
            btn.classList.add('success');
            if (!state[row]) state[row] = [0, 0];
            state[row][type] = 1;
            
            if (state[row][0] && state[row][1]) {
                localStorage.setItem(`lck_${row}`, Date.now() + LOCK_TIME);
                setTimeout(render, 500);
            }
        }

        function logout() { localStorage.removeItem('session'); location.reload(); }
        init();
    </script>
</body>
</html>
