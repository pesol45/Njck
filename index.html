<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Queue v4.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: #16161e;
            --accent: linear-gradient(135deg, #00b4db, #0083b0);
            --success: #10b981;
            --danger: #f43f5e;
            --text-p: #94a3b8;
            --text-h: #f8fafc;
        }

        /* ЗАЩИТА: При печати или создании скриншота через некоторые инструменты контент скроется */
        @media print { body { display: none !important; } }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-h);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            transition: filter 0.3s ease;
        }

        /* Экранирование при попытке скриншота (потеря фокуса) */
        .screenshot-detected {
            filter: brightness(0) !important;
            background: black !important;
            pointer-events: none;
        }

        #loginOverlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .box {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 28px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            width: 90%;
            max-width: 400px;
        }

        input {
            padding: 16px;
            font-size: 18px;
            border-radius: 14px;
            border: 1px solid #2d2d39;
            background: #0f0f13;
            color: white;
            margin-bottom: 20px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            outline: none;
        }

        #content {
            display: none;
            width: 90%;
            max-width: 450px;
        }

        .account-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid rgba(255,255,255,0.03);
            text-align: center;
        }

        .label { font-size: 11px; color: var(--text-p); text-transform: uppercase; font-weight: 800; margin-bottom: 10px; display: block; }
        
        .value { 
            font-family: monospace; 
            background: rgba(0,0,0,0.3); 
            padding: 15px; 
            border-radius: 12px; 
            font-size: 18px; 
            margin-bottom: 20px;
            color: var(--text-h);
        }

        .btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            text-transform: uppercase;
        }

        .btn.success { background: var(--success); }

        #qrcode { background: white; padding: 10px; border-radius: 12px; display: inline-block; margin-top: 20px; }
        
        .timer-val { font-size: 32px; font-weight: 800; color: var(--danger); display: block; margin: 15px 0; font-family: monospace; }
    </style>
</head>
<body oncontextmenu="return false;"> <div id="loginOverlay">
        <div class="box">
            <h2>Доступ</h2>
            <input type="password" id="passInput" placeholder="Код">
            <button class="btn" onclick="checkPass()">Открыть</button>
            <div id="qrcode"></div>
        </div>
    </div>

    <div id="content">
        <div id="accountDisplay"></div>
        <div style="text-align: center; margin-top: 20px;">
            <button class="btn" style="width:auto; background:#2d2d39; font-size:11px; padding: 8px 20px;" onclick="logout()">Выйти</button>
        </div>
    </div>

    <script>
        const TG_TOKEN = "8417193861:AAGCpd-AFl7HW2_tNbzlVvXA7kxEz1NyESc";
        const TG_CHAT_ID = "1209403544";
        const PASS = "1488";
        const LOCK_TIME = 86400000;

        const encryptedAccounts = [
            ["TWloYWlsX0FyYWJvdg==", "UTdjRTJiTjZzRg=="],
            ["U29rX1lhYklvY2huaXk=", "UjJ0WTd1QTFqVg=="],
            ["TGVvbmVsX1BlcHNp", "Rjl3RTByVDV5QQ=="],
            ["QWJzb2x1dGVfRm9yYmVz", "QTdrTTlwUjJ4Vg=="],
            ["S2FydG9zaGthX0ZyZWU=", "RDNqSDdnSzFzVQ=="],
            ["VmFJeWFfR3JhbmQ=", "UzZ2QjBuTTNrSg=="],
            ["TWFobW9vZF9BcmJpcw==", "VjNjWDlmRDJzRw=="],
            ["VHJpcHBpX1Ryb3BwaQ==", "VDV4UThlVzR6SA=="],
            ["TWFobW9vZF9NYWhtb29kb3Y=", "SDh1SjNtUTdwVw=="],
            ["TWloYWlsX0Fic29sdXRl", "V2ZZbUR0NFVJaQ=="],
            ["TWFobW9vZF9TaG92ZWw=", "SzVvWTFlUjl0RA=="],
            ["QW1ldGh5c3RfRGlhbW9uZA==", "WDJ6UjV0VzlxMw=="],
            ["TWloYWlsX1BoaWxsaXBz", "QzJtRDh5SjNlUQ=="],
            ["VHJhSWFsZWxvX1RyYWxhbGE=", "VzRuUjd0Wjl4Sw=="],
            ["TWljaGFpbF9QcmVzc3VyZQ==", "TTdhUDBzVTJjRg=="]
        ];

        // Функция отправки уведомления в Telegram
        async function sendTgAlert(msg) {
            try {
                await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TG_CHAT_ID, text: `🚨 ${msg}` })
                });
            } catch (e) { console.error("TG Error"); }
        }

        // Детектор скриншотов (через фокус и клавиши)
        window.addEventListener('blur', () => {
            document.body.classList.add('screenshot-detected');
            sendTgAlert("Попытка скриншота или переключение окна! Экран заблокирован.");
        });

        window.addEventListener('focus', () => {
            setTimeout(() => document.body.classList.remove('screenshot-detected'), 500);
        });

        window.addEventListener('keyup', (e) => {
            if (e.key === 'PrintScreen') {
                navigator.clipboard.writeText('Защищено системой');
                sendTgAlert("Нажата клавиша PrintScreen!");
                document.body.classList.add('screenshot-detected');
            }
        });

        function decode(str) { return decodeURIComponent(escape(atob(str))); }

        new QRCode(document.getElementById("qrcode"), {
            text: window.location.href,
            width: 100, height: 100
        });

        function checkPass() {
            if (document.getElementById('passInput').value === PASS) {
                localStorage.setItem('session', Date.now() + 3600000);
                init();
            } else { alert('Нет доступа'); }
        }

        function init() {
            const session = localStorage.getItem('session');
            if (session && Date.now() < parseInt(session)) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                renderNext();
            }
        }

        let state = [0, 0];
        let timerInterval = null;

        function renderNext() {
            const container = document.getElementById('accountDisplay');
            if (timerInterval) clearInterval(timerInterval);
            
            const now = Date.now();
            let nextIndex = -1;
            let minLockTime = Infinity;

            for (let i = 0; i < encryptedAccounts.length; i++) {
                const lock = localStorage.getItem(`lck_${i}`);
                if (!lock || now > parseInt(lock)) {
                    nextIndex = i;
                    break;
                }
                if (parseInt(lock) < minLockTime) minLockTime = parseInt(lock);
            }

            if (nextIndex === -1) {
                container.innerHTML = `
                    <div class="account-card">
                        <span class="label">База пуста</span>
                        <p>Доступ появится через:</p>
                        <span id="finalTimer" class="timer-val">00:00:00</span>
                    </div>
                `;
                startFinalCountdown(minLockTime);
                return;
            }

            const nick = decode(encryptedAccounts[nextIndex][0]);
            const pass = decode(encryptedAccounts[nextIndex][1]);
            state = [0, 0];

            container.innerHTML = `
                <div class="account-card">
                    <div style="margin-bottom: 25px;">
                        <span class="label">Аккаунт #${nextIndex + 1}</span>
                        <div class="value">${nick}</div>
                        <button class="btn" id="btn_n" onclick="cp('n', ${nextIndex}, '${nick}')">Ник</button>
                    </div>
                    <div>
                        <span class="label">Пароль</span>
                        <div class="value">••••••••</div>
                        <button class="btn" id="btn_p" onclick="cp('p', ${nextIndex}, '${pass}')">Пароль</button>
                    </div>
                </div>
            `;
        }

        function startFinalCountdown(targetTime) {
            function update() {
                const diff = targetTime - Date.now();
                if (diff <= 0) { renderNext(); return; }
                const h = Math.floor(diff / 3600000);
                const m = Math.floor((diff % 3600000) / 60000);
                const s = Math.floor((diff % 60000) / 1000);
                document.getElementById('finalTimer').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
            }
            update();
            timerInterval = setInterval(update, 1000);
        }

        function cp(type, idx, txt) {
            navigator.clipboard.writeText(txt);
            const btn = document.getElementById(type === 'n' ? 'btn_n' : 'btn_p');
            btn.innerText = 'OK';
            btn.classList.add('success');
            if (type === 'n') state[0] = 1;
            if (type === 'p') state[1] = 1;
            if (state[0] && state[1]) {
                localStorage.setItem(`lck_${idx}`, Date.now() + LOCK_TIME);
                setTimeout(renderNext, 600);
            }
        }

        function logout() { localStorage.removeItem('session'); location.reload(); }
        init();
    </script>
</body>
</html>
