<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Liquid Queue | Fixed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; }
        :root {
            --bg-depth: #0a0a0c;
            --glass-base: rgba(22, 22, 28, 0.75);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-primary: #eef2f5;
            --text-secondary: #9aa7b5;
            --accent-soft: #5c6f87;
            --success-soft: #5f8a6f;
        }
        body, html { width: 100%; height: 100%; background: #050508; font-family: 'Inter', system-ui, sans-serif; display: flex; justify-content: center; align-items: center; overflow: hidden; color: var(--text-primary); }
        #liquid-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.5; pointer-events: none; }
        .container { z-index: 10; width: 92%; max-width: 440px; }
        .glass-card { background: var(--glass-base); backdrop-filter: blur(20px); border-radius: 38px; border: 1px solid var(--glass-border); padding: 32px 28px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }
        .input-field { width: 100%; padding: 16px; font-size: 17px; background: rgba(0,0,0,0.4); border: 1px solid var(--glass-border); border-radius: 44px; color: white; text-align: center; outline: none; margin-bottom: 20px; }
        .btn { width: 100%; padding: 15px; border-radius: 44px; font-weight: 600; border: none; cursor: pointer; transition: 0.2s; margin-bottom: 12px; }
        .btn-primary { background: var(--accent-soft); color: white; }
        .btn-secondary { background: rgba(255,255,255,0.05); color: var(--text-secondary); }
        .btn-success { background: var(--success-soft) !important; color: white; }
        .account-card { background: rgba(0,0,0,0.2); border-radius: 30px; padding: 25px; border: 1px solid var(--glass-border); }
        .label-micro { font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--text-secondary); margin-bottom: 8px; display: block; }
        .value-block { font-family: monospace; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 15px; font-size: 15px; margin-bottom: 12px; border: 1px solid var(--glass-border); }
        .timer-large { font-family: monospace; font-size: 32px; color: #b45a6b; margin: 10px 0; display: block; }
    </style>
</head>
<body>
    <canvas id="liquid-canvas"></canvas>

    <div id="loginOverlay" class="container">
        <div class="glass-card">
            <h2 style="margin-bottom: 20px;">Liquid Queue</h2>
            <input type="password" id="passInput" class="input-field" placeholder="Код из Telegram">
            <button class="btn btn-primary" onclick="checkPass()">Вход</button>
            <button class="btn btn-secondary" id="requestBtn" onclick="sendAuthCodes()">Запросить коды</button>
        </div>
    </div>

    <div id="content" class="container" style="display: none;">
        <div id="accountDisplay"></div>
        <button class="btn btn-secondary" style="width: auto; margin-top: 20px; padding: 10px 30px;" onclick="logout()">Выйти</button>
    </div>

    <script>
        const TG_TOKEN = "8417193861:AAGCpd-AFl7HW2_tNbzlVvXA7kxEz1NyESc";
        const TG_CHAT_ID = "1209403544";
        const LOCK_TIME = 86400000;

        // ИСПРАВЛЕННЫЙ МАССИВ (Все в Base64)
        const encryptedAccounts = [
            ["TWloYWlsX0FyYWJvdg==", "UTdjRTJiTjZzRg=="],
            ["U29rX1lhYklvY2huaXk=", "UjJ0WTd1QTFqVg=="],
            ["TGVvbmVsX1BlcHNp", "Rjl3RTByVDV5QQ=="],
            ["QWJzb2x1dGVfRm9yYmVz", "QTdrTTlwUjJ4Vg=="],
            ["S2FydG9zaGthX0ZyZWU=", "RDNqSDdnSzFzVQ=="],
            ["VmFJeWFfR3JhbmQ=", "UzZ2QjBuTTNrSg=="],
            ["TWFobW9vZF9BcmJpcw==", "VjNjWDlmRDJzRw=="],
            ["VHJpcHBpX1Ryb3BwaQ==", "VDV4UThlVzR6SA=="],
            ["TWFobW9vZF9NYWhtb29kb3Y=", "SDh1SjNtUTdwVw=="], // Исправлено
            ["TWloYWlsX0Fic29sdXRl", "V2ZZbUR0NFVJaQ=="],
            ["TWFobW9vZF9TaG92ZWw=", "SzVvWTFlUjl0RA=="], // Исправлено
            ["QW1ldGh5c3RfRGlhbW9uZA==", "WDJ6UjV0VzlxMw=="],
            ["TWloYWlsX1BoaWxsaXBz", "QzJtRDh5SjNlUQ=="],
            ["VHJhSWFsZWxvX1RyYWxhbGE=", "VzRuUjd0Wjl4Sw=="],
            ["TWljaGFpbF9QcmVzc3VyZQ==", "TTdhUDBzVTJjRg=="]
        ];

        function decode(str) {
            try { return decodeURIComponent(escape(atob(str))); } catch(e) { return "Ошибка данных"; }
        }

        async function sendAuthCodes() {
            const btn = document.getElementById('requestBtn');
            const lCode = Math.floor(1000 + Math.random() * 9000).toString();
            const rCode = Math.floor(100000 + Math.random() * 899999).toString();
            sessionStorage.setItem('l_c', lCode); sessionStorage.setItem('r_c', rCode);
            btn.innerText = "Отправка...";
            try {
                await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TG_CHAT_ID, text: `🔹 Liquid\nВход: ${lCode}\nСброс: ${rCode}` })
                });
                btn.innerText = "Коды в TG";
            } catch(e) { btn.innerText = "Ошибка"; }
        }

        function checkPass() {
            const val = document.getElementById('passInput').value.trim();
            if (val === sessionStorage.getItem('r_c')) {
                for (let i=0; i<encryptedAccounts.length; i++) localStorage.removeItem(`lck_${i}`);
                alert("Таймеры сброшены"); location.reload(); return;
            }
            if (val === sessionStorage.getItem('l_c')) {
                localStorage.setItem('session', Date.now() + 3600000);
                initSession();
            } else { alert("Неверный код"); }
        }

        function initSession() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            render();
        }

        let tInt = null;
        function render() {
            if (tInt) clearInterval(tInt);
            const container = document.getElementById('accountDisplay');
            const now = Date.now();
            let free = -1, soon = Infinity;

            for (let i=0; i<encryptedAccounts.length; i++) {
                const l = localStorage.getItem(`lck_${i}`);
                if (!l || now >= parseInt(l)) { free = i; break; }
                if (parseInt(l) < soon) soon = parseInt(l);
            }

            if (free === -1) {
                container.innerHTML = `<div class="account-card"><span class="label-micro">Очередь занята</span><span id="timer" class="timer-large">--:--:--</span></div>`;
                tInt = setInterval(() => {
                    const d = soon - Date.now();
                    if (d <= 0) render();
                    const h = Math.floor(d/3600000), m = Math.floor((d%3600000)/60000), s = Math.floor((d%60000)/1000);
                    document.getElementById('timer').innerText = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
                }, 1000);
                return;
            }

            const n = decode(encryptedAccounts[free][0]), p = decode(encryptedAccounts[free][1]);
            container.innerHTML = `
                <div class="account-card">
                    <span class="label-micro">Аккаунт #${free+1}</span>
                    <div class="value-block">${n}</div>
                    <button class="btn btn-secondary" id="cN">Копировать ник</button>
                    <div class="value-block">••••••••</div>
                    <button class="btn btn-secondary" id="cP">Копировать пароль</button>
                </div>
            `;

            let nO = false, pO = false;
            document.getElementById('cN').onclick = () => {
                navigator.clipboard.writeText(n);
                document.getElementById('cN').innerText = "Готово";
                document.getElementById('cN').classList.add('btn-success');
                nO = true; if(nO && pO) { localStorage.setItem(`lck_${free}`, Date.now()+LOCK_TIME); setTimeout(render, 800); }
            };
            document.getElementById('cP').onclick = () => {
                navigator.clipboard.writeText(p);
                document.getElementById('cP').innerText = "Готово";
                document.getElementById('cP').classList.add('btn-success');
                pO = true; if(nO && pO) { localStorage.setItem(`lck_${free}`, Date.now()+LOCK_TIME); setTimeout(render, 800); }
            };
        }

        function logout() { localStorage.removeItem('session'); location.reload(); }

        // Фоновая анимация
        const cvs = document.getElementById('liquid-canvas');
        const ctx = cvs.getContext('2d');
        let pts = [];
        function resize() {
            cvs.width = window.innerWidth; cvs.height = window.innerHeight;
            pts = [];
            for(let i=0; i<50; i++) pts.push({x: Math.random()*cvs.width, y: Math.random()*cvs.height, vx: Math.random()-0.5, vy: Math.random()-0.5});
        }
        function draw() {
            ctx.clearRect(0,0,cvs.width,cvs.height);
            ctx.fillStyle = "rgba(100, 150, 255, 0.1)";
            pts.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, 2, 0, Math.PI*2); ctx.fill();
                p.x += p.vx; p.y += p.vy;
                if(p.x<0 || p.x>cvs.width) p.vx*=-1; if(p.y<0 || p.y>cvs.height) p.vy*=-1;
            });
            requestAnimationFrame(draw);
        }
        window.onload = () => {
            resize(); draw();
            if (localStorage.getItem('session') > Date.now()) initSession();
        };
    </script>
</body>
</html>
