<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Удобная База Аккаунтов</title>
    <style>
        :root {
            --primary-bg: #1a1a2e;
            --card-bg: #ffffff;
            --accent: #4ecca3;
            --danger: #ff4b2b;
            --text-main: #333;
            --text-light: #999;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--primary-bg);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* Авторизация */
        #loginOverlay {
            position: fixed;
            inset: 0;
            background: var(--primary-bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #loginOverlay input {
            padding: 15px;
            font-size: 20px;
            border-radius: 12px;
            border: none;
            margin-bottom: 15px;
            width: 200px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }

        /* Контейнер */
        #content {
            display: none;
            width: 100%;
            max-width: 600px;
            padding: 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: white;
            margin-bottom: 20px;
        }

        /* Карточки строк */
        .account-card {
            background: var(--card-bg);
            border-radius: 15px;
            margin-bottom: 15px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .data-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .label {
            font-size: 12px;
            color: var(--text-light);
            text-transform: uppercase;
            font-weight: bold;
        }

        .value {
            font-family: 'Consolas', monospace;
            font-size: 16px;
            word-break: break-all;
            margin-bottom: 5px;
        }

        /* Крупные кнопки */
        .copy-btn {
            background-color: #f0f2f5;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .copy-btn:active { transform: scale(0.95); }
        .copy-btn.success {
            background-color: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        /* Таймер */
        .lock-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px dashed rgba(255, 255, 255, 0.3);
            color: white;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            margin-bottom: 15px;
        }

        .timer-text {
            font-size: 20px;
            font-weight: bold;
            color: var(--danger);
            display: block;
            margin-top: 5px;
        }

        .logout-btn {
            background: none;
            border: 1px solid white;
            color: white;
            padding: 5px 10px;
            border-radius: 8px;
            cursor: pointer;
            opacity: 0.7;
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <h2 style="color: white; margin-bottom: 20px;">Доступ ограничен</h2>
        <input type="password" id="passInput" placeholder="Пароль">
        <button onclick="checkPass()" class="copy-btn" style="background: var(--accent); border: none; width: 230px; color: white;">ВОЙТИ</button>
    </div>

    <div id="content">
        <div class="header">
            <h3>Список аккаунтов</h3>
            <button class="logout-btn" onclick="logout()">Выйти</button>
        </div>
        <div id="listContainer"></div>
    </div>

    <script>
        const ACCESS_PASS = "1488";
        const LOGIN_DURATION = 60 * 60 * 1000;
        const LOCK_DURATION = 24 * 60 * 60 * 1000;

        const accounts = [
            ["Mihail_Arabov", "Q7cE2bN6sF"], ["Sok_YabIochniy", "R2tY7uA1jV"],
            ["Leonel_Pepsi", "F9wE0rT5yA"], ["Absolute_Forbes", "A7kM9pR2xV"],
            ["Kartoshka_Free", "D3jH7gK1sU"], ["VaIya_Grand", "S6vB0nM3kJ"],
            ["Mahmood_Arbis", "V3cX9fD2sG"], ["Trippi_Troppi", "T5xQ8eW4zH"],
            ["Mahmood_Mahmoodov", "H8uJ3mQ7pW"], ["Mihail_Absolute", "WfYmDt4UIi"],
            ["Mahmood_Shovel", "K5oY1eR9tD"], ["Amethyst_Diamond", "X2zR5tW9q3"],
            ["Mihail_Phillips", "C2mD8yJ3eQ"], ["TraIalelo_Tralala", "W4nR7tZ9xK"],
            ["Michail_Pressure", "M7aP0sU2cF"]
        ];

        let copyState = {};

        function checkPass() {
            if (document.getElementById('passInput').value === ACCESS_PASS) {
                localStorage.setItem('session_expiry', Date.now() + LOGIN_DURATION);
                initApp();
            } else { alert('Неверно!'); }
        }

        function initApp() {
            const session = localStorage.getItem('session_expiry');
            if (session && Date.now() < parseInt(session)) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                render();
            }
        }

        function render() {
            const container = document.getElementById('listContainer');
            container.innerHTML = '';
            const now = Date.now();

            accounts.forEach((acc, index) => {
                const lockTime = localStorage.getItem(`lock_${index}`);
                
                if (lockTime && now < parseInt(lockTime)) {
                    const div = document.createElement('div');
                    div.className = 'lock-card';
                    div.innerHTML = `Аккаунт скрыт. Вернется через:<br><span class="timer-text" id="time_${index}">${formatTime(parseInt(lockTime) - now)}</span>`;
                    container.appendChild(div);
                    startCountdown(index, lockTime);
                } else {
                    const div = document.createElement('div');
                    div.className = 'account-card';
                    div.innerHTML = `
                        <div class="data-group">
                            <span class="label">Ник</span>
                            <span class="value">${acc[0]}</span>
                            <button class="copy-btn" onclick="handleCopy(this, ${index}, 0, '${acc[0]}')">Копировать</button>
                        </div>
                        <div class="data-group">
                            <span class="label">Пароль</span>
                            <span class="value">${acc[1]}</span>
                            <button class="copy-btn" onclick="handleCopy(this, ${index}, 1, '${acc[1]}')">Копировать</button>
                        </div>
                    `;
                    container.appendChild(div);
                }
            });
        }

        function handleCopy(btn, rowIndex, type, text) {
            navigator.clipboard.writeText(text);
            btn.innerText = 'ГОТОВО';
            btn.classList.add('success');

            if (!copyState[rowIndex]) copyState[rowIndex] = [false, false];
            copyState[rowIndex][type] = true;

            if (copyState[rowIndex][0] && copyState[rowIndex][1]) {
                localStorage.setItem(`lock_${rowIndex}`, Date.now() + LOCK_DURATION);
                setTimeout(render, 600);
            }
        }

        function startCountdown(index, expiry) {
            const timer = setInterval(() => {
                const el = document.getElementById(`time_${index}`);
                const diff = expiry - Date.now();
                if (!el || diff <= 0) { clearInterval(timer); render(); }
                else { el.innerText = formatTime(diff); }
            }, 1000);
        }

        function formatTime(ms) {
            const h = Math.floor(ms / 3600000);
            const m = Math.floor((ms % 3600000) / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            return `${h}ч ${m}м ${s}с`;
        }

        function logout() {
            localStorage.removeItem('session_expiry');
            location.reload();
        }

        initApp();
    </script>
</body>
</html>
