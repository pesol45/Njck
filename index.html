<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Quantum Queue v7.0 — Light</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none; /* легкая защита от выделения, не ломает копирование */
        }
        :root {
            --bg: #050507;
            --card-bg: rgba(20, 20, 25, 0.92);
            --accent: linear-gradient(135deg, #00f2fe, #4facfe);
            --success: #00e676;
            --danger: #ff1744;
            --text-p: #8899a6;
            --text-h: #ffffff;
            --border: rgba(255, 255, 255, 0.08);
        }

        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
            background-color: var(--bg); color: var(--text-h);
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        #bg-canvas { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            z-index: -1; opacity: 0; transition: opacity 1.2s ease;
            pointer-events: none;
        }

        .container { z-index: 10; width: 90%; max-width: 440px; transition: 0.3s ease; }

        /* Общий стиль карточек */
        .box {
            background: var(--card-bg); padding: 32px 28px; border-radius: 32px; text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6); border: 1px solid var(--border);
            backdrop-filter: blur(12px);
        }

        input {
            padding: 16px; font-size: 18px; border-radius: 20px; border: 1px solid #2d2d39;
            background: rgba(0,0,0,0.5); color: white; margin-bottom: 20px; width: 100%;
            box-sizing: border-box; text-align: center; outline: none; transition: 0.2s;
            letter-spacing: 0.5px;
        }
        input:focus { border-color: #00f2fe; box-shadow: 0 0 12px rgba(0,242,254,0.3); }

        .btn {
            background: var(--accent); color: white; border: none; border-radius: 40px;
            padding: 14px; font-weight: 700; cursor: pointer; width: 100%;
            text-transform: uppercase; letter-spacing: 0.5px; transition: 0.2s;
            font-size: 15px;
        }
        .btn:hover { transform: translateY(-2px); filter: brightness(1.02); box-shadow: 0 6px 14px rgba(0,242,254,0.25); }
        .btn.secondary { background: #1e1e28; color: #aab2c1; border: 1px solid var(--border); }
        .btn.danger { background: var(--danger); }
        .btn.success-bg { background: var(--success); color: #000; }

        /* Панель аккаунтов */
        .account-card {
            background: var(--card-bg); border-radius: 32px; padding: 28px 20px;
            border: 1px solid var(--border); text-align: center; margin-bottom: 15px;
            backdrop-filter: blur(8px);
        }

        .label { font-size: 11px; color: var(--text-p); text-transform: uppercase; font-weight: 800; margin-bottom: 8px; display: block; letter-spacing: 1px; }
        .value { font-family: 'Fira Mono', monospace; background: rgba(0,0,0,0.4); padding: 12px; border-radius: 20px; font-size: 16px; margin-bottom: 15px; border: 1px solid var(--border); word-break: break-all; }

        /* Админка (упрощена) */
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 16px; background: rgba(0,0,0,0.2); padding: 8px 12px; border-radius: 24px; }
        .stat-val { color: var(--text-h); font-weight: 700; }

        .timer-val { font-size: 34px; font-weight: 800; color: var(--danger); display: block; margin: 15px 0; font-family: monospace; text-shadow: 0 0 8px rgba(255,23,68,0.5); letter-spacing: 2px; }
        
        .flex-buttons { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; }
        .flex-buttons .btn { flex: 1; margin-bottom: 0; }

        #accountDisplay .btn { margin-top: 4px; margin-bottom: 12px; width: 80%; }
    </style>
</head>
<body oncontextmenu="return false;">

    <canvas id="bg-canvas"></canvas>

    <!-- ЭКРАН ЛОГИНА -->
    <div id="loginOverlay" class="container">
        <div class="box">
            <h2 style="margin-top:0; letter-spacing: -0.5px;">⚡ Quantum Queue</h2>
            <p style="color: #9aaebf; font-size: 13px; margin-bottom: 24px;">Введите код доступа</p>
            <input type="password" id="passInput" placeholder="Код доступа" autocomplete="off">
            <button class="btn" id="loginBtn" onclick="checkPass()">Войти</button>
            <button class="btn secondary" id="requestBtn" onclick="sendAuthCodes()">📲 Запросить коды в Telegram</button>
        </div>
    </div>

    <!-- УПРОЩЕННАЯ АДМИН ПАНЕЛЬ (без пинга, глобалки и кнопки закрыть) -->
    <div id="adminPanel" class="container" style="display: none;">
        <div class="box">
            <h2 style="margin-top:0; color: #00f2fe;">🛡️ Admin Panel</h2>
            <div class="stat-row"><span>📦 Всего аккаунтов:</span><span class="stat-val" id="totalAccs">0</span></div>
            <div class="stat-row"><span>⏳ Заблокировано сегодня:</span><span class="stat-val" id="usedAccs">0</span></div>
            <p style="font-size: 11px; color: #5f6c7a; margin-top: 20px;">сброс локов по спец-коду (6 цифр)</p>
        </div>
    </div>

    <!-- ОСНОВНОЕ МЕНЮ ОЧЕРЕДИ -->
    <div id="content" class="container" style="display: none;">
        <div id="accountDisplay"></div>
        <div style="text-align: center; margin-top: 12px;">
            <button class="btn secondary" style="width: auto; background: #1a1a22; padding: 8px 28px;" onclick="logout()">🔒 Выйти</button>
        </div>
    </div>

    <script>
        // ------------------- КОНФИГУРАЦИЯ -------------------
        const TG_TOKEN = "8417193861:AAGCpd-AFl7HW2_tNbzlVvXA7kxEz1NyESc";
        const TG_CHAT_ID = "1209403544";
        const LOCK_TIME = 86400000; // 24 часа в мс

        // Зашифрованные аккаунты (base64)
        const encryptedAccounts = [
            ["TWloYWlsX0FyYWJvdg==", "UTdjRTJiTjZzRg=="], ["U29rX1lhYklvY2huaXk=", "UjJ0WTd1QTFqVg=="],
            ["TGVvbmVsX1BlcHNp", "Rjl3RTByVDV5QQ=="], ["QWJzb2x1dGVfRm9yYmVz", "QTdrTTlwUjJ4Vg=="],
            ["S2FydG9zaGthX0ZyZWU=", "RDNqSDdnSzFzVQ=="], ["VmFJeWFfR3JhbmQ=", "UzZ2QjBuTTNrSg=="],
            ["TWFobW9vZF9BcmJpcw==", "VjNjWDlmRDJzRw=="], ["VHJpcHBpX1Ryb3BwaQ==", "VDV4UThlVzR6SA=="],
            ["TWFobW9vZF_Mahmoodov", "SDh1SjNtUTdwVw=="], ["TWloYWlsX0Fic29sdXRl", "V2ZZbUR0NFVJaQ=="],
            ["TWFobW9vZF_Shovel", "SzVvWTFlUjl0RA=="], ["QW1ldGh5c3RfRGlhbW9uZA==", "WDJ6UjV0VzlxMw=="],
            ["TWloYWlsX1BoaWxsaXBz", "QzJtRDh5SjNlUQ=="], ["VHJhSWFsZWxvX1RyYWxhbGE=", "VzRuUjd0Wjl4Sw=="],
            ["TWljaGFpbF9QcmVzc3VyZQ==", "TTdhUDBzVTJjRg=="]
        ];

        // ---------- ВСПОМОГАТЕЛЬНЫЕ ФУНКЦИИ ----------
        function decode(str) { 
            try {
                return decodeURIComponent(escape(atob(str))); 
            } catch(e) { return "Ошибка декода"; }
        }

        // ---------- АНИМИРОВАННЫЙ ФОН (ЧАСТИЦЫ) ----------
        let canvas, ctx, particles = [], animationId = null;
        
        function initCanvas() {
            canvas = document.getElementById('bg-canvas');
            if(!canvas) return;
            ctx = canvas.getContext('2d');
            const resizeCanvas = () => {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                particles = [];
                for(let i = 0; i < 60; i++) {
                    particles.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        vx: (Math.random() - 0.5) * 0.6,
                        vy: (Math.random() - 0.5) * 0.6,
                        size: Math.random() * 2.5 + 0.8
                    });
                }
            };
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            
            function draw() {
                if(!ctx) return;
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = 'rgba(0, 212, 255, 0.4)';
                for(let p of particles) {
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    p.x += p.vx;
                    p.y += p.vy;
                    if(p.x < 0 || p.x > canvas.width) p.vx *= -1;
                    if(p.y < 0 || p.y > canvas.height) p.vy *= -1;
                    p.x = Math.min(Math.max(p.x, 0), canvas.width);
                    p.y = Math.min(Math.max(p.y, 0), canvas.height);
                }
                animationId = requestAnimationFrame(draw);
            }
            draw();
        }

        function activateBg() {
            const bgCanvas = document.getElementById('bg-canvas');
            if(bgCanvas) bgCanvas.style.opacity = '1';
            if(!canvas) initCanvas();
        }

        // ---------- РАБОТА С TG И КОДАМИ ----------
        async function sendAuthCodes() {
            const btn = document.getElementById('requestBtn');
            if(!btn) return;
            const loginCode = Math.floor(1000 + Math.random() * 9000).toString();
            const resetCode = Math.floor(100000 + Math.random() * 899999).toString();
            sessionStorage.setItem('temp_login_code', loginCode);
            sessionStorage.setItem('temp_reset_code', resetCode);
            const originalText = btn.innerText;
            btn.innerText = "⏳ Отправка...";
            btn.disabled = true;
            try {
                const response = await fetch(`https://api.telegram.org/bot${TG_TOKEN}/sendMessage`, {
                    method: 'POST', 
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        chat_id: TG_CHAT_ID, 
                        text: `🔐 Quantum Queue\n🟢 Код входа: ${loginCode}\n🔴 Код сброса всех таймеров: ${resetCode}\n---` 
                    })
                });
                if(response.ok) btn.innerText = "✅ Коды в TG";
                else btn.innerText = "❌ Ошибка";
            } catch (e) {
                console.warn(e);
                btn.innerText = "⚠️ Ошибка сети";
            }
            setTimeout(() => { if(btn) { btn.innerText = "📲 Коды в Telegram"; btn.disabled = false; } }, 2500);
        }

        // ---------- ПРОВЕРКА ВХОДА (УДАЛЕН МАСТЕР-ПАРОЛЬ 1.1) ----------
        function checkPass() {
            const inputField = document.getElementById('passInput');
            const input = inputField.value.trim();
            const tempLogin = sessionStorage.getItem('temp_login_code');
            const tempReset = sessionStorage.getItem('temp_reset_code');

            // 1. СБРОС ЛОКОВ (код сброса) — оставляем
            if (tempReset && input === tempReset) {
                let removed = 0;
                for (let i = 0; i < encryptedAccounts.length; i++) {
                    if (localStorage.getItem(`lck_${i}`)) {
                        localStorage.removeItem(`lck_${i}`);
                        removed++;
                    }
                }
                sessionStorage.removeItem('temp_reset_code');
                alert(`✅ Сброшено ${removed} блокировок. Все аккаунты разблокированы.`);
                location.reload();
                return;
            }
            
            // 2. Обычный временный код входа (единственный способ)
            if (tempLogin && input === tempLogin) {
                activateBg();
                localStorage.setItem('session', Date.now() + 3600000); // 1 час сессия
                sessionStorage.removeItem('temp_login_code');
                initUserSession();
            } else {
                alert("❌ Неверный код доступа!");
                inputField.value = '';
            }
        }

        // Инициализация пользовательской очереди
        function initUserSession() {
            document.getElementById('loginOverlay').style.display = 'none';
            document.getElementById('content').style.display = 'block';
            renderNextAccount();
        }

        // Упрощенная админ-панель (открывается только через код сброса? нет, теперь мастер-пароль удален)
        // Для доступа к админке нужно использовать специальный код: 1488 больше НЕ РАБОТАЕТ.
        // Но если нужно показать админку — сейчас она не открывается без мастер-пароля, это ок.
        // Удаляем функционал полностью: showAdminPanel не вызывается нигде.
        
        // Обновление статистики используется только внутри админ-панели, но админ-панель недоступна.
        // Оставим функцию updateUsedStats для возможного расширения. Она нигде не вызывается.
        function updateUsedStats() {
            let used = 0;
            const now = Date.now();
            for (let i = 0; i < encryptedAccounts.length; i++) {
                const lock = localStorage.getItem(`lck_${i}`);
                if (lock && now < parseInt(lock)) used++;
            }
            const usedSpan = document.getElementById('usedAccs');
            if(usedSpan) usedSpan.innerText = used;
            const totalSpan = document.getElementById('totalAccs');
            if(totalSpan) totalSpan.innerText = encryptedAccounts.length;
        }
        
        // ---------- ОСНОВНАЯ ЛОГИКА ОЧЕРЕДИ ----------
        let currentTimerInterval = null;
        
        function renderNextAccount() {
            if (currentTimerInterval) clearInterval(currentTimerInterval);
            const container = document.getElementById('accountDisplay');
            if (!container) return;

            const now = Date.now();
            let availableIndex = -1;
            let earliestLockTime = Infinity;

            // Ищем первый свободный аккаунт (без блокировки или срок истек)
            for (let i = 0; i < encryptedAccounts.length; i++) {
                const lockVal = localStorage.getItem(`lck_${i}`);
                if (!lockVal) {
                    availableIndex = i;
                    break;
                }
                const lockTime = parseInt(lockVal, 10);
                if (now >= lockTime) {
                    availableIndex = i;
                    break;
                }
                if (lockTime < earliestLockTime) earliestLockTime = lockTime;
            }

            // Если все заблокированы
            if (availableIndex === -1) {
                const resetTime = earliestLockTime;
                container.innerHTML = `
                    <div class="account-card">
                        <span class="label">🔒 ОЧЕРЕДЬ ЗАБЛОКИРОВАНА</span>
                        <span class="label">⏳ До разблокировки любого аккаунта:</span>
                        <span id="finalTimer" class="timer-val">--:--:--</span>
                        <p style="font-size:12px; color:#aaa;">Все аккаунты используются. Таймер обратного отсчета</p>
                    </div>
                `;
                startFinalCountdown(resetTime);
                return;
            }

            // Рендерим доступный аккаунт
            const nick = decode(encryptedAccounts[availableIndex][0]);
            const pass = decode(encryptedAccounts[availableIndex][1]);
            const accNumber = availableIndex + 1;
            
            container.innerHTML = `
                <div class="account-card">
                    <span class="label">🎮 АККАУНТ #${accNumber}</span>
                    <div class="value" id="displayNick">${escapeHtml(nick)}</div>
                    <button class="btn" id="copyNickBtn" data-idx="${availableIndex}" data-type="nick" data-value="${escapeAttr(nick)}">📋 Копировать ник</button>
                    <div class="value" id="displayPass">••••••••</div>
                    <button class="btn" id="copyPassBtn" data-idx="${availableIndex}" data-type="pass" data-value="${escapeAttr(pass)}">🔑 Копировать пароль</button>
                    <small style="color:#7e8c9e;">✔ После копирования обоих полей аккаунт заблокируется на 24 часа</small>
                </div>
            `;
            
            // Вешаем обработчики динамически
            const copyNick = document.getElementById('copyNickBtn');
            const copyPass = document.getElementById('copyPassBtn');
            
            let nickCopied = false, passCopied = false;
            const idx = availableIndex;
            
            const completeLock = () => {
                if (nickCopied && passCopied) {
                    localStorage.setItem(`lck_${idx}`, String(Date.now() + LOCK_TIME));
                    // После блокировки перерисовываем очередь
                    renderNextAccount();
                }
            };
            
            copyNick.onclick = (e) => {
                e.preventDefault();
                const val = nick;
                navigator.clipboard.writeText(val).then(() => {
                    copyNick.innerText = "✅ Ник скопирован";
                    copyNick.classList.add('success-bg');
                    setTimeout(() => { if(copyNick) copyNick.innerText = "📋 Копировать ник"; copyNick.classList.remove('success-bg'); }, 1500);
                    if (!nickCopied) {
                        nickCopied = true;
                        completeLock();
                    }
                }).catch(() => alert("Ошибка копирования"));
            };
            
            copyPass.onclick = (e) => {
                e.preventDefault();
                const val = pass;
                navigator.clipboard.writeText(val).then(() => {
                    copyPass.innerText = "✅ Пароль скопирован";
                    copyPass.classList.add('success-bg');
                    setTimeout(() => { if(copyPass) copyPass.innerText = "🔑 Копировать пароль"; copyPass.classList.remove('success-bg'); }, 1500);
                    if (!passCopied) {
                        passCopied = true;
                        completeLock();
                    }
                }).catch(() => alert("Ошибка копирования"));
            };
        }
        
        // вспомогательные функции безопасности (XSS)
        function escapeHtml(str) {
            return str.replace(/[&<>]/g, function(m) {
                if (m === '&') return '&amp;';
                if (m === '<') return '&lt;';
                if (m === '>') return '&gt;';
                return m;
            }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) {
                return c;
            });
        }
        function escapeAttr(str) {
            return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function startFinalCountdown(targetTimestamp) {
            if (currentTimerInterval) clearInterval(currentTimerInterval);
            const updateTimer = () => {
                const now = Date.now();
                const diff = targetTimestamp - now;
                if (diff <= 0) {
                    clearInterval(currentTimerInterval);
                    renderNextAccount();
                    return;
                }
                const hours = Math.floor(diff / 3600000);
                const minutes = Math.floor((diff % 3600000) / 60000);
                const seconds = Math.floor((diff % 60000) / 1000);
                const timerSpan = document.getElementById('finalTimer');
                if (timerSpan) timerSpan.innerText = `${String(hours).padStart(2,'0')}:${String(minutes).padStart(2,'0')}:${String(seconds).padStart(2,'0')}`;
            };
            updateTimer();
            currentTimerInterval = setInterval(updateTimer, 1000);
        }

        // Инициализация страницы
        function init() {
            const sess = localStorage.getItem('session');
            if (sess && Date.now() < parseInt(sess)) {
                // сессия активна
                activateBg();
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                renderNextAccount();
            } else {
                // Показываем логин
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('content').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'none';
                localStorage.removeItem('session');
                setTimeout(() => {
                    if(!canvas) initCanvas();
                    const bg = document.getElementById('bg-canvas');
                    if(bg) bg.style.opacity = '0.5';
                }, 0);
            }
        }
        
        function logout() {
            if (currentTimerInterval) clearInterval(currentTimerInterval);
            localStorage.removeItem('session');
            location.reload();
        }
        
        // старт при загрузке
        window.addEventListener('load', () => {
            init();
            // Экспорт необходимых глобальных функций
            window.checkPass = checkPass;
            window.sendAuthCodes = sendAuthCodes;
            window.logout = logout;
        });
    </script>
</body>
</html>
