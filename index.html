<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Private Storage</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #0a0a0c;
            --card-bg: #16161e;
            --accent: linear-gradient(135deg, #00b4db, #0083b0);
            --success: #10b981;
            --danger: #f43f5e;
            --text-p: #94a3b8;
            --text-h: #f8fafc;
        }

        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text-h);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            -webkit-tap-highlight-color: transparent;
        }

        /* Экран входа */
        #loginOverlay {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }

        .login-box {
            background: var(--card-bg);
            padding: 40px 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            max-width: 320px;
            width: 100%;
        }

        input {
            padding: 16px;
            font-size: 18px;
            border-radius: 14px;
            border: 1px solid #2d2d39;
            background: #0f0f13;
            color: white;
            margin-bottom: 20px;
            width: 80%;
            text-align: center;
            outline: none;
            transition: 0.3s;
        }

        input:focus { border-color: #00b4db; box-shadow: 0 0 15px rgba(0,180,219,0.2); }

        /* Контент */
        #content {
            display: none;
            width: 100%;
            max-width: 550px;
            padding: 30px 20px;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
        }

        .header h2 { font-weight: 700; letter-spacing: -0.5px; margin: 0; }

        /* Карточки аккаунтов */
        .account-card {
            background: var(--card-bg);
            border-radius: 20px;
            margin-bottom: 18px;
            padding: 22px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            border: 1px solid rgba(255,255,255,0.03);
            transition: 0.3s;
        }

        .account-card:hover { border-color: rgba(0,180,219,0.3); transform: translateY(-2px); }

        .label { font-size: 10px; color: var(--text-p); text-transform: uppercase; font-weight: 800; letter-spacing: 1px; margin-bottom: 8px; display: block; }
        
        .value { 
            font-family: 'JetBrains Mono', monospace; 
            background: rgba(0,0,0,0.2); 
            padding: 12px; 
            border-radius: 10px; 
            font-size: 14px; 
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.02);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Кнопки */
        .btn {
            background: var(--accent);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            width: 100%;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn:active { transform: translateY(1px); }
        .btn.success { background: var(--success); }

        .logout-btn { background: #2d2d39; color: #94a3b8; padding: 8px 16px; border-radius: 10px; font-size: 12px; text-transform: none; width: auto; }

        /* Таймер */
        .lock-card {
            background: rgba(244, 63, 94, 0.05);
            border: 1px dashed var(--danger);
            padding: 30px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 18px;
            color: var(--danger);
            font-weight: 600;
        }

        #qrcode { 
            background: white; 
            padding: 12px; 
            border-radius: 16px; 
            display: inline-block; 
            margin-top: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-box">
            <h2 style="margin-top:0">Вход</h2>
            <input type="password" id="passInput" placeholder="Код доступа">
            <button class="btn" onclick="checkPass()">Открыть базу</button>
            <div id="qrcode"></div>
            <p style="font-size: 11px; color: var(--text-p); margin-top: 20px;">Используйте QR для быстрого входа</p>
        </div>
    </div>

    <div id="content">
        <div class="header">
            <h2>Аккаунты</h2>
            <button class="btn logout-btn" onclick="logout()">Выйти</button>
        </div>
        <div id="listContainer"></div>
    </div>

    <script>
        const PASS = "1488";
        const SESSION_TIME = 3600000;
        const LOCK_TIME = 86400000;

        const encryptedAccounts = [
            ["TWloYWlsX0FyYWJvdg==", "UTdjRTJiTjZzRg=="],
            ["U29rX1lhYklvY2huaXk=", "UjJ0WTd1QTFqVg=="],
            ["TGVvbmVsX1BlcHNp", "Rjl3RTByVDV5QQ=="],
            ["QWJzb2x1dGVfRm9yYmVz", "QTdrTTlwUjJ4Vg=="],
            ["S2FydG9zaGthX0ZyZWU=", "RDNqSDdnSzFzVQ=="],
            ["VmFJeWFfR3JhbmQ=", "UzZ2QjBuTTNrSg=="],
            ["TWFobW9vZF9BcmJpcw==", "VjNjWDlmRDJzRw=="],
            ["VHJpcHBpX1Ryb3BwaQ==", "VDV4UThlVzR6SA=="],
            ["TWFobW9vZF9NYWhtb29kb3Y=", "SDh1SjNtUTdwVw=="],
            ["TWloYWlsX0Fic29sdXRl", "V2ZZbUR0NFVJaQ=="],
            ["TWFobW9vZF9TaG92ZWw=", "SzVvWTFlUjl0RA=="],
            ["QW1ldGh5c3RfRGlhbW9uZA==", "WDJ6UjV0VzlxMw=="],
            ["TWloYWlsX1BoaWxsaXBz", "QzJtRDh5SjNlUQ=="],
            ["VHJhSWFsZWxvX1RyYWxhbGE=", "VzRuUjd0Wjl4Sw=="],
            ["TWljaGFpbF9QcmVzc3VyZQ==", "TTdhUDBzVTJjRg=="]
        ];

        function decode(str) { return decodeURIComponent(escape(atob(str))); }

        new QRCode(document.getElementById("qrcode"), {
            text: window.location.href,
            width: 120,
            height: 120,
            colorDark : "#000000",
            colorLight : "#ffffff",
            correctLevel : QRCode.CorrectLevel.H
        });

        function checkPass() {
            if (document.getElementById('passInput').value === PASS) {
                localStorage.setItem('session', Date.now() + SESSION_TIME);
                init();
            } else { alert('Доступ отклонен'); }
        }

        function init() {
            const session = localStorage.getItem('session');
            if (session && Date.now() < parseInt(session)) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                render();
            }
        }

        function render() {
            const container = document.getElementById('listContainer');
            container.innerHTML = '';
            
            const currentHash = btoa(JSON.stringify(encryptedAccounts)).substring(0, 16);
            if (localStorage.getItem('db_hash') !== currentHash) {
                Object.keys(localStorage).forEach(k => k.startsWith('lck_') && localStorage.removeItem(k));
                localStorage.setItem('db_hash', currentHash);
            }

            encryptedAccounts.forEach((acc, i) => {
                const lock = localStorage.getItem(`lck_${i}`);
                if (lock && Date.now() < parseInt(lock)) {
                    container.innerHTML += `<div class="lock-card">АККАУНТ СКРЫТ НА 24Ч</div>`;
                } else {
                    const nick = decode(acc[0]);
                    const pass = decode(acc[1]);
                    const card = document.createElement('div');
                    card.className = 'account-card';
                    card.innerHTML = `
                        <div class="data-group">
                            <span class="label">Пользователь</span>
                            <div class="value">${nick}</div>
                            <button class="btn" onclick="cp(this, ${i}, 0, '${nick}')">Ник</button>
                        </div>
                        <div class="data-group">
                            <span class="label">Пароль</span>
                            <div class="value">••••••••</div>
                            <button class="btn" onclick="cp(this, ${i}, 1, '${pass}')">Пароль</button>
                        </div>
                    `;
                    container.appendChild(card);
                }
            });
        }

        let state = {};
        function cp(btn, row, type, txt) {
            navigator.clipboard.writeText(txt);
            btn.innerText = 'ГОТОВО';
            btn.classList.add('success');
            if (!state[row]) state[row] = [0, 0];
            state[row][type] = 1;
            
            if (state[row][0] && state[row][1]) {
                localStorage.setItem(`lck_${row}`, Date.now() + LOCK_TIME);
                setTimeout(render, 500);
            }
        }

        function logout() { localStorage.removeItem('session'); location.reload(); }
        init();
    </script>
</body>
</html>
