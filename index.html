<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>База Аккаунтов (Полный Автомат)</title>
    <style>
        :root {
            --bg: #0f172a;
            --card: #ffffff;
            --accent: #10b981;
            --danger: #ef4444;
            --text: #1e293b;
        }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg); margin: 0; display: flex; justify-content: center; min-height: 100vh; color: var(--text); }
        #loginOverlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; }
        #loginOverlay input { padding: 15px; font-size: 20px; border-radius: 12px; border: 2px solid #334155; background: #1e293b; color: white; margin-bottom: 15px; text-align: center; outline: none; }
        #content { display: none; width: 100%; max-width: 600px; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; color: white; margin-bottom: 25px; }
        .account-card { background: var(--card); border-radius: 16px; margin-bottom: 16px; padding: 20px; box-shadow: 0 10px 15px rgba(0,0,0,0.1); display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .data-group { display: flex; flex-direction: column; gap: 8px; }
        .label { font-size: 11px; color: #64748b; text-transform: uppercase; font-weight: 800; }
        .value { font-family: monospace; font-size: 15px; background: #f1f5f9; padding: 10px; border-radius: 8px; overflow: hidden; }
        .copy-btn { background-color: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px; padding: 16px; font-size: 14px; font-weight: 700; cursor: pointer; transition: 0.2s; color: #475569; }
        .copy-btn:active { transform: translateY(2px); }
        .copy-btn.success { background-color: var(--accent); color: white; border-color: var(--accent); }
        .lock-card { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: white; border-radius: 16px; padding: 25px; text-align: center; margin-bottom: 16px; }
        .timer-text { font-size: 22px; font-weight: 800; color: var(--danger); display: block; margin-top: 8px; }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <h2 style="color: white; margin-bottom: 20px;">Вход</h2>
        <input type="password" id="passInput" placeholder="Пароль">
        <button onclick="checkPass()" class="copy-btn" style="background: var(--accent); border: none; width: 230px; color: white;">ОТКРЫТЬ</button>
    </div>

    <div id="content">
        <div class="header">
            <h2 style="margin:0">Аккаунты</h2>
            <button onclick="logout()" style="background:none; border:1px solid white; color:white; border-radius:5px; padding: 5px 10px; cursor:pointer;">Выход</button>
        </div>
        <div id="listContainer"></div>
    </div>

    <script>
        const ACCESS_PASS = "1488";
        const LOGIN_DURATION = 60 * 60 * 1000;
        const LOCK_DURATION = 24 * 60 * 60 * 1000;

        const accounts = [
            ["Mihail_Arabov", "Q7cE2bN6sF"], ["Sok_YabIochniy", "R2tY7uA1jV"],
            ["Leonel_Pepsi", "F9wE0rT5yA"], ["Absolute_Forbes", "A7kM9pR2xV"],
            ["Kartoshka_Free", "D3jH7gK1sU"], ["VaIya_Grand", "S6vB0nM3kJ"],
            ["Mahmood_Arbis", "V3cX9fD2sG"], ["Trippi_Troppi", "T5xQ8eW4zH"],
            ["Mahmood_Mahmoodov", "H8uJ3mQ7pW"], ["Mihail_Absolute", "WfYmDt4UIi"],
            ["Mahmood_Shovel", "K5oY1eR9tD"], ["Amethyst_Diamond", "X2zR5tW9q3"],
            ["Mihail_Phillips", "C2mD8yJ3eQ"], ["TraIalelo_Tralala", "W4nR7tZ9xK"],
            ["Michail_Pressure", "M7aP0sU2cF"]
        ];

        let copyState = {};

        // Функция создания уникального ключа на основе списка аккаунтов
        function getAccountsHash() {
            return btoa(JSON.stringify(accounts)).substring(0, 32);
        }

        // Авто-сброс если список изменился
        function autoSync() {
            const currentHash = getAccountsHash();
            const savedHash = localStorage.getItem('db_hash');
            
            if (savedHash !== currentHash) {
                // Список изменился — чистим старые блокировки
                Object.keys(localStorage).forEach(key => {
                    if (key.startsWith('lock_')) localStorage.removeItem(key);
                });
                localStorage.setItem('db_hash', currentHash);
            }
        }

        function checkPass() {
            if (document.getElementById('passInput').value === ACCESS_PASS) {
                localStorage.setItem('session_expiry', Date.now() + LOGIN_DURATION);
                initApp();
            } else { alert('Неверно!'); }
        }

        function initApp() {
            autoSync();
            const session = localStorage.getItem('session_expiry');
            if (session && Date.now() < parseInt(session)) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                render();
            }
        }

        function render() {
            const container = document.getElementById('listContainer');
            container.innerHTML = '';
            const now = Date.now();

            accounts.forEach((acc, index) => {
                const lockTime = localStorage.getItem(`lock_${index}`);
                if (lockTime && now < parseInt(lockTime)) {
                    const div = document.createElement('div');
                    div.className = 'lock-card';
                    div.innerHTML = `Блокировка 24ч<br><span class="timer-text" id="time_${index}">${formatTime(parseInt(lockTime) - now)}</span>`;
                    container.appendChild(div);
                    startCountdown(index, lockTime);
                } else {
                    const div = document.createElement('div');
                    div.className = 'account-card';
                    div.innerHTML = `
                        <div class="data-group">
                            <span class="label">Ник</span>
                            <div class="value">${acc[0]}</div>
                            <button class="copy-btn" onclick="handleCopy(this, ${index}, 0, '${acc[0]}')">Копировать</button>
                        </div>
                        <div class="data-group">
                            <span class="label">Пароль</span>
                            <div class="value">${acc[1]}</div>
                            <button class="copy-btn" onclick="handleCopy(this, ${index}, 1, '${acc[1]}')">Копировать</button>
                        </div>
                    `;
                    container.appendChild(div);
                }
            });
        }

        function handleCopy(btn, rowIndex, type, text) {
            navigator.clipboard.writeText(text);
            btn.innerText = '✅';
            btn.classList.add('success');
            if (!copyState[rowIndex]) copyState[rowIndex] = [false, false];
            copyState[rowIndex][type] = true;
            if (copyState[rowIndex][0] && copyState[rowIndex][1]) {
                localStorage.setItem(`lock_${rowIndex}`, Date.now() + LOCK_DURATION);
                setTimeout(render, 500);
            }
        }

        function startCountdown(index, expiry) {
            const timer = setInterval(() => {
                const el = document.getElementById(`time_${index}`);
                const diff = expiry - Date.now();
                if (!el || diff <= 0) { clearInterval(timer); render(); }
                else { el.innerText = formatTime(diff); }
            }, 1000);
        }

        function formatTime(ms) {
            const h = Math.floor(ms / 3600000);
            const m = Math.floor((ms % 3600000) / 60000);
            const s = Math.floor((ms % 60000) / 1000);
            return `${h}ч ${m}м ${s}с`;
        }

        function logout() {
            localStorage.removeItem('session_expiry');
            location.reload();
        }

        initApp();
    </script>
</body>
</html>
