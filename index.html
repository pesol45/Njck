<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Base v3.0</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        :root { --bg: #0b0e14; --card: #1e293b; --accent: #10b981; --danger: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg); color: white; margin: 0; display: flex; justify-content: center; min-height: 100vh; }
        
        #ipBlocker, #loginOverlay { position: fixed; inset: 0; background: var(--bg); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 1000; padding: 20px; text-align: center; }
        
        input { padding: 15px; font-size: 20px; border-radius: 12px; border: 1px solid #334155; background: #0f172a; color: white; margin-bottom: 15px; text-align: center; width: 220px; }
        
        #content { display: none; width: 100%; max-width: 600px; padding: 20px; }
        .account-card { background: var(--card); border-radius: 16px; margin-bottom: 15px; padding: 20px; display: grid; grid-template-columns: 1fr 1fr; gap: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        .label { font-size: 11px; color: #94a3b8; text-transform: uppercase; font-weight: 800; }
        .value { font-family: monospace; background: #0f172a; padding: 10px; border-radius: 8px; margin: 5px 0; overflow: hidden; }
        
        button { background: var(--accent); color: white; border: none; border-radius: 10px; padding: 15px; font-weight: bold; cursor: pointer; width: 100%; }
        button:active { transform: scale(0.98); }
        
        #qrcode { background: white; padding: 10px; border-radius: 10px; margin-top: 20px; }
        .lock-card { border: 1px dashed var(--danger); padding: 20px; border-radius: 15px; text-align: center; margin-bottom: 15px; }
    </small>
    </style>
</head>
<body>

    <div id="ipBlocker" style="display:none;">
        <h1 style="color: var(--danger);">ДОСТУП ЗАПРЕЩЕН</h1>
        <p>Ваш IP не числится в белом списке.</p>
        <p id="userIpDisplay" style="font-family: monospace; opacity: 0.6;"></p>
    </div>

    <div id="loginOverlay">
        <h2>🔒 Введите ключ</h2>
        <input type="password" id="passInput" placeholder="****">
        <button onclick="checkPass()" style="width: 250px;">ВОЙТИ</button>
        <div id="qrcode"></div>
        <p style="font-size: 12px; opacity: 0.5; margin-top: 10px;">Сканируй QR для быстрого входа</p>
    </div>

    <div id="content">
        <div style="display:flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <h2>База (Crypto)</h2>
            <button onclick="logout()" style="width: 80px; padding: 5px; font-size: 12px; background: #334155;">Выйти</button>
        </div>
        <div id="listContainer"></div>
    </div>

    <script>
        // === НАСТРОЙКИ БЕЗОПАСНОСТИ ===
        const ALLOWED_IP = "ВАШ_IP_ТУТ"; // Замени на свой IP (сайт подскажет его при ошибке)
        const PASS = "1488";
        
        // Данные зашифрованы в Base64. В коде вместо ников — "абракадабра"
        const encryptedAccounts = [
            ["TWloYWlsX0FyYWJvdg==", "UTdjRTJiTjZzRg=="],
            ["U29rX1lhYklvY2huaXk=", "UjJ0WTd1QTFqVg=="],
            ["TGVvbmVsX1BlcHNp", "Rjl3RTByVDV5QQ=="],
            ["QWJzb2x1dGVfRm9yYmVz", "QTdrTTlwUjJ4Vg=="],
            ["S2FydG9zaGthX0ZyZWU=", "RDNqSDdnSzFzVQ=="],
            ["VmFJeWFfR3JhbmQ=", "UzZ2QjBuTTNrSg=="],
            ["TWFobW9vZF9BcmJpcw==", "VjNjWDlmRDJzRw=="],
            ["VHJpcHBpX1Ryb3BwaQ==", "VDV4UThlVzR6SA=="],
            ["TWFobW9vZF9NYWhtb29kb3Y=", "SDh1SjNtUTdwVw=="],
            ["TWloYWlsX0Fic29sdXRl", "V2ZZbUR0NFVJaQ=="],
            ["TWFobW9vZF9TaG92ZWw=", "SzVvWTFlUjl0RA=="],
            ["QW1ldGh5c3RfRGlhbW9uZA==", "WDJ6UjV0VzlxMw=="],
            ["TWloYWlsX1BoaWxsaXBz", "QzJtRDh5SjNlUQ=="],
            ["VHJhSWFsZWxvX1RyYWxhbGE=", "VzRuUjd0Wjl4Sw=="],
            ["TWljaGFpbF9QcmVzc3VyZQ==", "TTdhUDBzVTJjRg=="]
        ];

        // Дешифровка
        function decode(str) { return decodeURIComponent(escape(atob(str))); }

        // Проверка IP
        async function checkIP() {
            try {
                const response = await fetch('https://api.ipify.org?format=json');
                const data = await response.json();
                const userIp = data.ip;
                document.getElementById('userIpDisplay').innerText = "Ваш IP: " + userIp;

                if (ALLOWED_IP !== "ВАШ_IP_ТУТ" && userIp !== ALLOWED_IP) {
                    document.getElementById('ipBlocker').style.display = 'flex';
                    document.getElementById('loginOverlay').style.display = 'none';
                    return false;
                }
                return true;
            } catch (e) {
                console.log("Ошибка проверки IP, пропускаем...");
                return true;
            }
        }

        // Генерация QR
        new QRCode(document.getElementById("qrcode"), {
            text: window.location.href,
            width: 128,
            height: 128,
            colorDark : "#000000",
            colorLight : "#ffffff"
        });

        function checkPass() {
            if (document.getElementById('passInput').value === PASS) {
                localStorage.setItem('session', Date.now() + 3600000);
                init();
            } else { alert('Критическая ошибка доступа'); }
        }

        async function init() {
            const isIpOk = await checkIP();
            if (!isIpOk) return;

            const session = localStorage.getItem('session');
            if (session && Date.now() < parseInt(session)) {
                document.getElementById('loginOverlay').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                render();
            }
        }

        function render() {
            const container = document.getElementById('listContainer');
            container.innerHTML = '';
            const hash = btoa(JSON.stringify(encryptedAccounts)).substring(0, 16);
            
            // Авто-сброс таймеров при изменении кода
            if (localStorage.getItem('db_hash') !== hash) {
                Object.keys(localStorage).forEach(k => k.startsWith('lck_') && localStorage.removeItem(k));
                localStorage.setItem('db_hash', hash);
            }

            encryptedAccounts.forEach((acc, i) => {
                const lock = localStorage.getItem(`lck_${i}`);
                if (lock && Date.now() < parseInt(lock)) {
                    container.innerHTML += `<div class="lock-card">Аккаунт заблокирован на 24ч</div>`;
                } else {
                    const nick = decode(acc[0]);
                    const pass = decode(acc[1]);
                    const card = document.createElement('div');
                    card.className = 'account-card';
                    card.innerHTML = `
                        <div class="data-group">
                            <span class="label">User</span>
                            <div class="value">${nick}</div>
                            <button onclick="cp(this, ${i}, 0, '${nick}')">Ник</button>
                        </div>
                        <div class="data-group">
                            <span class="label">Pass</span>
                            <div class="value">********</div>
                            <button onclick="cp(this, ${i}, 1, '${pass}')">Пароль</button>
                        </div>
                    `;
                    container.appendChild(card);
                }
            });
        }

        let state = {};
        function cp(btn, row, type, txt) {
            navigator.clipboard.writeText(txt);
            btn.innerText = '✅';
            btn.style.background = '#059669';
            if (!state[row]) state[row] = [0, 0];
            state[row][type] = 1;
            if (state[row][0] && state[row][1]) {
                localStorage.setItem(`lck_${row}`, Date.now() + 86400000);
                setTimeout(render, 500);
            }
        }

        function logout() { localStorage.removeItem('session'); location.reload(); }

        init();
    </script>
</body>
</html>
